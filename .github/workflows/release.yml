name: Build and Release

on:
  push:
    tags:
      - "v*"
      - "*.*.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            os: ubuntu-24.04
          - name: windows
            os: windows-latest
          - name: mac-arm64
            os: macos-15
          - name: mac-x64
            os: macos-15-intel

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Import Apple Developer ID Application certificate
        if: runner.os == 'macOS'
        env:
          CSC_LINK_B64: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: |
          if [[ -n "$CSC_LINK_B64" ]]; then
            echo "$CSC_LINK_B64" | base64 -d > /tmp/certs.p12
            echo "CSC_LINK=/tmp/certs.p12" >> "$GITHUB_ENV"
            echo "CSC_KEY_PASSWORD=${CSC_KEY_PASSWORD}" >> "$GITHUB_ENV"
            echo "::notice::Imported Developer ID Application certificate for code signing"
          else
            echo "::warning::Secret CSC_LINK is not set; the macOS app will NOT be signed"
          fi

      - name: Import Apple Developer ID Installer certificate
        if: runner.os == 'macOS'
        env:
          CSC_INSTALLER_LINK_B64: ${{ secrets.CSC_INSTALLER_LINK }}
          CSC_INSTALLER_KEY_PASSWORD: ${{ secrets.CSC_INSTALLER_KEY_PASSWORD }}
        run: |
          if [[ -n "$CSC_INSTALLER_LINK_B64" ]]; then
            echo "$CSC_INSTALLER_LINK_B64" | base64 -d > /tmp/installer.p12
            echo "CSC_INSTALLER_LINK=/tmp/installer.p12" >> "$GITHUB_ENV"
            echo "CSC_INSTALLER_KEY_PASSWORD=${CSC_INSTALLER_KEY_PASSWORD}" >> "$GITHUB_ENV"
            echo "::notice::Imported Developer ID Installer certificate for PKG signing"
          else
            echo "::warning::Secret CSC_INSTALLER_LINK is not set; the PKG will NOT be signed"
          fi

      - name: Build Linux packages
        if: runner.os == 'Linux'
        run: npx electron-builder --linux AppImage deb --publish never

      - name: Build Windows installer
        if: runner.os == 'Windows'
        run: npx electron-builder --win nsis --publish never

      - name: Build macOS installer (arm64)
        if: runner.os == 'macOS' && matrix.name == 'mac-arm64'
        run: npx electron-builder --mac dmg pkg --arm64 --publish never
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Build macOS installer (x64)
        if: runner.os == 'macOS' && matrix.name == 'mac-x64'
        run: npx electron-builder --mac dmg pkg --x64 --publish never
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Notarize and staple DMG
        if: runner.os == 'macOS'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          # electron-builder's notarize integration covers the .app and .pkg,
          # but not the DMG container, so submit and staple it explicitly.
          if [[ -z "$CSC_LINK" || -z "$APPLE_ID" || -z "$APPLE_APP_SPECIFIC_PASSWORD" || -z "$APPLE_TEAM_ID" ]]; then
            echo "Skipping DMG notarization (missing signing certificate or notarization credentials)."
            exit 0
          fi
          DMG=$(ls dist/*.dmg | head -1)
          xcrun notarytool submit "$DMG" --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" --team-id "$APPLE_TEAM_ID" --wait
          xcrun stapler staple "$DMG"

      - name: Inspect macOS signature
        if: runner.os == 'macOS'
        run: |
          APP_PATH=$(find dist -maxdepth 2 -type d -name "*.app" | head -1)
          if [[ -z "$APP_PATH" ]]; then
            echo "::error::No .app bundle found under dist/"
            exit 1
          fi
          echo "Inspecting $APP_PATH"
          SIG_OUTPUT=$(codesign -dv "$APP_PATH" 2>&1 || true)
          echo "$SIG_OUTPUT"
          if echo "$SIG_OUTPUT" | grep -q 'Authority=Developer ID'; then
            codesign --verify --deep --strict --verbose=4 "$APP_PATH"
            echo "--- spctl assessment (notarization) ---"
            spctl -a -vvv --type execute "$APP_PATH" || true
          else
            echo "App is not signed with a Developer ID; skipping spctl assessment."
          fi

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.name }}
          if-no-files-found: error
          path: |
            dist/*.dmg
            dist/*.pkg
            dist/*.exe
            dist/*.AppImage
            dist/*.deb
            dist/*.blockmap

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Compute release metadata
        id: meta
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF_NAME}"
          else
            VERSION=$(node -p "require('./package.json').version")
            TAG="v${VERSION}-build.${GITHUB_RUN_NUMBER}"
          fi

          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "name=Release ${TAG}" >> "$GITHUB_OUTPUT"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.name }}
          target_commitish: ${{ github.sha }}
          prerelease: false
          generate_release_notes: true
          files: |
            release-assets/**/*.dmg
            release-assets/**/*.pkg
            release-assets/**/*.exe
            release-assets/**/*.AppImage
            release-assets/**/*.deb
            release-assets/**/*.blockmap
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
